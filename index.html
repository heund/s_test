<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PWA demo">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="./manifest.json">
    <title>PWA demo</title>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./shared/style.css">
    <link rel="stylesheet" href="./styles/landing.css">
</head>
<body>
    <div id="app">
        <div class="app-shell">
            <div class="app-background" aria-hidden="true"></div>
            <section class="passcode-gate" id="passcodeGate" aria-label="Passcode" hidden>
                <form class="passcode-panel" id="passcodeForm" autocomplete="off">
                    <h1>PWA demo</h1>
                    <label for="passcodeInput">Passcode</label>
                    <input id="passcodeInput" name="passcode" type="password" inputmode="numeric" autocomplete="off" autocapitalize="none" spellcheck="false">
                    <p class="passcode-error" id="passcodeError" role="alert" aria-live="polite"></p>
                    <button type="submit">Enter</button>
                </form>
            </section>
            <header class="app-header" aria-label="PWA demo">
                <div class="app-brand" aria-label="Project title">PWA demo</div>
                <div class="language-toggle" role="group" aria-label="Language">
                    <button class="language-toggle-option is-active" type="button" data-language="ko" aria-pressed="true" aria-disabled="true">한국어</button>
                    <button class="language-toggle-option" type="button" data-language="en" aria-pressed="false" aria-disabled="true">EN</button>
                </div>
            </header>
            <main class="app-main">
                <section class="app-view" id="appView">
                    <div id="landingAnimation">
                        <div id="landingBackground"></div>
                        <div id="landingLogo">
                            <h1>PWA demo</h1>
                        </div>
                    </div>

                    <section class="pwa-view home-view is-active" id="homeView" data-view="home" aria-label="Home">
                        <div class="view-panel">
                            <h1>PWA demo</h1>
                            <p>QR deity collection bare mechanics build.</p>
                            <p>Choose Map, Camera, or Collection.</p>
                        </div>
                    </section>

                    <section class="pwa-view map-view" id="mapView" data-view="map" aria-label="Map" hidden>
                        <div class="view-panel focused-panel">
                            <div class="surface-header">
                                <h2>Map</h2>
                                <button class="surface-close-button" type="button" data-close-surface aria-label="Return to main page">×</button>
                            </div>
                            <div class="surface-body">
                                <p>Map image removed in bare mechanics build.</p>
                            </div>
                        </div>
                    </section>

                    <section class="pwa-view camera-view" id="cameraView" data-view="camera" aria-label="Camera" hidden>
                        <div class="qr-scanner-container" id="qrScanner">
                            <video id="qrVideo" width="100%" height="100%" autoplay muted playsinline></video>
                            <div class="qr-scanner-overlay">
                                <div class="qr-scan-window" aria-hidden="true">
                                    <span class="qr-highlight-left"></span>
                                    <span class="qr-shadow-top"></span>
                                </div>
                            </div>
                            <div class="qr-scanner-text">QR코드를 스캔해주세요</div>
                            <div class="paper-fold-reveal-target" id="paperFoldRevealTarget" aria-hidden="true">
                            </div>
                            <div class="paper-fold-overlay" id="paperFoldOverlay" aria-hidden="true" hidden>
                                <div class="paper-fold-stage">
                                    <span class="paper-fold-left-duplicate-panel" aria-hidden="true">
                                        <svg class="paper-fold-left-duplicate-svg" viewBox="-12 -12 124 124" preserveAspectRatio="none">
                                            <polygon class="paper-fold-left-duplicate-shape" points="-12,-12 50,50 -12,112" />
                                        </svg>
                                    </span>
                                    <span class="paper-fold-right-duplicate-panel" aria-hidden="true">
                                        <svg class="paper-fold-right-duplicate-svg" viewBox="-12 -12 124 124" preserveAspectRatio="none">
                                            <polygon class="paper-fold-right-duplicate-shape" points="112,-12 50,50 112,112" />
                                        </svg>
                                    </span>
                                    <span class="paper-fold-top-duplicate-panel" aria-hidden="true">
                                        <svg class="paper-fold-top-duplicate-svg" viewBox="-12 -12 124 124" preserveAspectRatio="none">
                                            <polygon class="paper-fold-top-duplicate-extension" points="-44,-58 144,-58 112,-12 -12,-12" />
                                            <polygon class="paper-fold-top-duplicate-shape" points="-12,-12 50,50 112,-12" />
                                        </svg>
                                    </span>
                                    <span class="paper-fold-bottom-duplicate-panel" aria-hidden="true">
                                        <svg class="paper-fold-bottom-duplicate-svg" viewBox="-12 -12 124 124" preserveAspectRatio="none">
                                            <polygon class="paper-fold-bottom-duplicate-extension" points="-44,158 144,158 112,112 -12,112" />
                                            <polygon class="paper-fold-bottom-duplicate-shape" points="-12,112 50,50 112,112" />
                                        </svg>
                                    </span>
                                    <span class="paper-fold-panel paper-fold-panel-left">
                                        <svg class="paper-fold-svg" viewBox="-12 -12 124 124" preserveAspectRatio="none" aria-hidden="true">
                                            <defs>
                                                <pattern id="paperFoldTextureLeft" patternUnits="objectBoundingBox" patternContentUnits="objectBoundingBox" width="1" height="1">
                                                    <image href="./styles/assets/paper_main_moretexture.png" x="0" y="0" width="1" height="1" preserveAspectRatio="xMidYMid slice" />
                                                </pattern>
                                            </defs>
                                            <polygon class="paper-fold-outline" points="-12,-12 50,50 -12,112" />
                                            <polygon class="paper-fold-shape paper-fold-shape-left" points="-12,-12 50,50 -12,112" fill="url(#paperFoldTextureLeft) #d7c3a6" />
                                        </svg>
                                    </span>
                                    <span class="paper-fold-panel paper-fold-panel-right">
                                        <svg class="paper-fold-svg" viewBox="-12 -12 124 124" preserveAspectRatio="none" aria-hidden="true">
                                            <defs>
                                                <pattern id="paperFoldTextureRight" patternUnits="objectBoundingBox" patternContentUnits="objectBoundingBox" width="1" height="1">
                                                    <image href="./styles/assets/paper_main_moretexture.png" x="0" y="0" width="1" height="1" preserveAspectRatio="xMidYMid slice" />
                                                </pattern>
                                            </defs>
                                            <polygon class="paper-fold-outline" points="112,-12 50,50 112,112" />
                                            <polygon class="paper-fold-shape paper-fold-shape-right" points="112,-12 50,50 112,112" fill="url(#paperFoldTextureRight) #d7c3a6" />
                                        </svg>
                                    </span>
                                    <span class="paper-fold-panel paper-fold-panel-top">
                                        <svg class="paper-fold-svg" viewBox="-12 -12 124 124" preserveAspectRatio="none" aria-hidden="true">
                                            <defs>
                                                <pattern id="paperFoldTextureTop" patternUnits="objectBoundingBox" patternContentUnits="objectBoundingBox" width="1" height="1">
                                                    <image href="./styles/assets/paper_main_moretexture.png" x="0" y="0" width="1" height="1" preserveAspectRatio="xMidYMid slice" />
                                                </pattern>
                                            </defs>
                                            <polygon class="paper-fold-outline" points="-12,-12 50,50 112,-12" />
                                            <polygon class="paper-fold-shape paper-fold-shape-top" points="-12,-12 50,50 112,-12" fill="url(#paperFoldTextureTop) #d7c3a6" />
                                        </svg>
                                    </span>
                                    <span class="paper-fold-panel paper-fold-panel-bottom">
                                        <svg class="paper-fold-svg" viewBox="-12 -12 124 124" preserveAspectRatio="none" aria-hidden="true">
                                            <defs>
                                                <pattern id="paperFoldTextureBottom" patternUnits="objectBoundingBox" patternContentUnits="objectBoundingBox" width="1" height="1">
                                                    <image href="./styles/assets/paper_main_moretexture.png" x="0" y="0" width="1" height="1" preserveAspectRatio="xMidYMid slice" />
                                                </pattern>
                                            </defs>
                                            <polygon class="paper-fold-outline" points="-12,112 50,50 112,112" />
                                            <polygon class="paper-fold-shape paper-fold-shape-bottom" points="-12,112 50,50 112,112" fill="url(#paperFoldTextureBottom) #d7c3a6" />
                                        </svg>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="pwa-view collection-view" id="collectionView" data-view="collection" aria-label="Collection" hidden>
                        <div class="view-panel focused-panel collection-panel">
                            <div class="surface-header">
                                <h2>Collection</h2>
                                <button class="surface-close-button" type="button" data-close-surface aria-label="Return to main page">×</button>
                            </div>
                            <div class="surface-body collection-body">
                                <button class="clear-cache-btn" id="clearCollectionButton" type="button">Clear Cache</button>
                                <div class="collection-grid" id="collectionGrid">
                                    <div class="collection-empty" id="collectionEmpty">
                                        <p>No items collected yet</p>
                                        <p>Scan QR codes to collect deities</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </section>
            </main>
            <nav class="app-nav-layer" id="appNavLayer" aria-label="Primary navigation">
                <div class="bottom-nav">
                    <button class="bottom-nav-item" id="mapNavButton" type="button" data-view-target="map" aria-label="Map">Map</button>
                    <button class="bottom-nav-item bottom-nav-camera" id="cameraNavButton" type="button" data-view-target="camera" aria-label="Camera">Camera</button>
                    <button class="bottom-nav-item" id="collectionNavButton" type="button" data-view-target="collection" aria-label="Collection">Collection</button>
                </div>
            </nav>
            <div class="app-overlay-layer" id="appOverlayLayer"></div>
            <div class="app-toast-layer" id="appToastLayer" aria-live="polite"></div>
        </div>
    </div>

    <div id="loadingScreen" class="glassmorphism-loading">
        <div class="loading-spinner"></div>
    </div>
    <script type="module" src="./scripts/landing.js"></script>
</body>
</html>
